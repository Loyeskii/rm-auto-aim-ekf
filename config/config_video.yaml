%YAML:1.0
---
# ============================================================
# 视频专用配置（真实比赛录像）
# 与 config.yaml 唯一的区别：装甲板尺寸用真实标准值 135x125mm
# 用法： armor_neural.exe --video --config config/config_video.yaml
# ============================================================
# ============================================================
# 神经网络方案 · 参数配置
# 第一行必须是 %YAML:1.0（OpenCV FileStorage 的要求）。
# 注意：不要写跨行数组，需要成组的数值请拆成独立标量。
# ============================================================

camera:
  # 内参是对这个分辨率标定的；实际图像分辨率不同时程序按比例缩放 fx/fy/cx/cy
  calib_width: 1358
  calib_height: 1058
  fx: 2362.2795952460974
  fy: 2336.1916035376717
  cx: 679.17513921636282
  cy: 529.06858905837635
  k1: -0.098561592108101559
  k2: 0.11173066531932681
  p1: -0.0038352945867108721
  p2: -0.0020421443354436304
  k3: 0.0

armor_size:
  # ⚠ 这里有三种完全不同的"尺寸"，不要混用：
  #     ① 模块外形      140×125 / 235×127   （官方产品页，安装用）
  #     ② 灯条外角矩形  135×55  / 230×55    （视觉用 ← 本段填的就是它）
  #     ③ 整块板        板高 125/127，数字比灯条高，数字 ROI 要上下延展
  #
  # 为什么用 ②：检测网络的四个关键点落在灯条外角上，PnP 的物方点
  # 必须与这四个点同源。宽 = 两根灯条外沿间距，高 = 灯条长度。
  #
  # 若把高度误填成 125，IPPE 只能靠俯仰把高度压缩 55/125=0.44 去凑，
  # 表现就是"解出来的 pitch 高达 60° 以上"，同时距离偏大。
  small_w: 0.135
  small_h: 0.055
  large_w: 0.230
  large_h: 0.055

detect:
  # 注意这里是 fp32 版本：原始权重是 fp16，OpenCV 的 DNN 无法解析
  # （Conv 权重为 fp16 + 图中有 Cast 节点），已转换为纯 fp32，见 README 说明
  model: models/Infantry-v8n-fp32.onnx
  input_w: 640
  input_h: 480
  conf_thres: 0.25      # 类别置信度阈值
  nms_thres: 0.45       # NMS 的 IoU 阈值
  max_dets: 20          # NMS 后最多保留数量
  swap_rb: 1            # 网络用 RGB 训练，BGR 输入需换通道
  # 大/小装甲板判据：灯条外角矩形的 宽/高。
  #   小板 135/55 = 2.45     大板 230/55 = 4.18
  # 2.5 卡在两者之间；斜视会让观测值变小，但不会越过另一类的下限。
  # ⚠ 判错的代价：物方点换成另一套宽度，距离整体差 1.7 倍。
  large_aspect: 2.5

thresh:
  max_range_m: 15.0     # 解算距离上限，超过视为无效解
  min_class_conf: 0.30  # 低于该置信度时号码显示为 "?"

model:
  labels: config/labels.txt

# ============================================================
# 整车状态估计
# ============================================================
tracker:
  # 主目标号码：本作业直接指定，不做目标选择。
  # 实战中每辆敌车各维护一个滤波器，作业里只实例化一个。
  target_id: "4"
  max_match_distance: 1.00    # 硬距离上限（m）；主判据是马氏门，这里只兜底
  max_match_yaw_diff: 1.0     # 朝向门限（rad），用来区分相邻两块板
  max_reproj_err: 5.0         # 重投影误差门限（px），粗差剔除
  initial_radius: 0.26        # 初始化时假设的板到中心距离（m）
  lost_time_thres: 0.3        # 连续多久没有有效更新算丢失（s）
  radius_min: 0.12            # 半径钳位，防止发散
  radius_max: 0.40
  armors_num: 4               # 标准步兵 4 块板
  switch_frames: 5            # 换锚确认帧数（防止板号每帧乱跳，见 tracker.cpp）
  pitch: 0.0                  # 重投影时板的俯仰角（rad）。真实板基本竖直，取 0；
                              # 若发现投影的板整体前倾/后仰，可在此微调

ekf:
  # 过程噪声：连续白噪声加速度模型，量纲见 h 报告
  sigma2_q_xyz: 20.0
  sigma2_q_yaw: 100.0
  sigma2_q_r: 800.0

  # 角点噪声（px），用来把量测噪声 R 从像素推到米
  # 数值越大，滤波器越不信量测
  sigma_px: 1.0

  # 世界系量测的主要噪声其实不来自角点，而是姿态抖动（以 |p| 为力臂放大）
  # 与自车平移未建模。这两项决定 R 的下限，进而决定滤波器有多信量测。
  sigma_att_deg: 3.0
  sigma_world_floor: 0.08
  sigma_yaw_deg: 6.0   # 朝向量测的标准差下限（薄板 PnP 朝向本身不准）

  # 门控：位置用马氏距离（起手松、收敛紧），四维量测用 NIS
  nis_gate: 9.488      # chi2(4, 0.95)
  gate_pos: 7.815      # chi2(3, 0.95)

  # 初始协方差的对角标准差（不是方差）
  p0_sigma_pos: 0.10
  p0_sigma_vel: 1.00
  p0_sigma_za: 0.05
  p0_sigma_vza: 0.50
  p0_sigma_yaw: 0.20
  p0_sigma_vyaw: 2.00
  p0_sigma_r: 0.05

imu:
  path: data/original/IMU.txt
  # 数据里是「收到时间戳」，回退这个量才是采集时刻；
  # 正值表示取 (t_图像 - 值) 处的姿态，亚采样用 slerp 插值
  recv_latency: 0.009

io:
  # 相对路径的基准是「工程根目录」，不是这个 yaml 所在目录，也不是 cwd
  # （见 config.cpp 的 resolvePath：返回 RM_PROJECT_ROOT + "/" + 路径）。
  # 所以这里不能再写 ../，否则会跑到工程根目录的上一级去。
  video: data/original/2026-05-20_23-57-31.avi
  video_out: data/processed/output.mp4
  states_csv: data/processed/states.csv
  states_png: data/processed/states.png
